name: Release checks
on:
  pull_request:
  push:
    branches: [main, codex/supabase-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
        working-directory: staging
      - run: npm ci
        working-directory: apps/staging-portal
      - run: node --test scripts/*.test.mjs staging/*.test.mjs apps/staging-portal/lib/*.test.mjs
      - run: node test.mjs
        working-directory: staging
      - run: npm run build
        working-directory: apps/staging-portal
        env:
          VERCEL_ENV: production
          LAUNCHSTUDIO_MARKETING_INDEXABLE: 'false'
      - run: node build.mjs
        working-directory: site
